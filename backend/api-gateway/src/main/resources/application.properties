spring.application.name=api-gateway
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.routes[0].id=user-auth
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webflux.routes[2].id=vendor-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://VENDOR-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/vendors/**

spring.cloud.gateway.server.webflux.routes[3].id=product-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/products/**

spring.cloud.gateway.server.webflux.routes[4].id=order-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.server.webflux.routes[5].id=tenant-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://TENANT-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/tenants/**

spring.cloud.gateway.server.webflux.routes[6].id=tenant-application-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://TENANT-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/tenant-applications/**

spring.cloud.gateway.server.webflux.routes[7].id=payment-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/payments/**

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins[0]=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[0]=GET
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[1]=POST
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[2]=PUT
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[3]=PATCH
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[4]=DELETE
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[5]=OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders[0]=*

spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
