
spring.application.name=tenant-service
server.port=8086

# Eureka Service Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
eureka.instance.instance-id=localhost:tenant-service:8086

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/tenant_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET}

# Security Debug Logging
logging.level.org.springframework.security=TRACE
logging.level.com.marketgrid.tenant=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=TRACE
logging.level.org.springframework.security.web.access=TRACE
logging.level.org.springframework.security.web.authentication=TRACE
logging.level.org.springframework.security.config.annotation.web.configuration=TRACE