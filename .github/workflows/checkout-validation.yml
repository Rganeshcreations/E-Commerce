name: Checkout integration validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/secure-checkout-integration

jobs:
  frontend-build:
    name: Build React frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  payment-service-tests:
    name: Test Payment Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/payment-service/pom.xml
      - name: Test Payment Service
        run: mvn -B -f backend/payment-service/pom.xml test

  order-service-tests:
    name: Test Order Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/order-service/pom.xml
      - name: Test Order Service
        run: mvn -B -f backend/order-service/pom.xml test
